spec_version: 1
id: crm.leads.update
system: crm
operation: {method: PATCH, path: "/leads/{lead_id}"}
effect_class: reversible
fidelity: exact
before_image:
  read: {method: GET, path: "/leads/{lead_id}", params: {lead_id: "$.args.lead_id"}}
  fields: ["name", "email", "metadata"]
produces: []
inverse:
  operation: {method: PATCH, path: "/leads/{lead_id}"}
  params: {lead_id: "$.args.lead_id"}
  body_from_before_image: ["name", "email", "metadata"]
verify:
  read: {method: GET, path: "/leads/{lead_id}", params: {lead_id: "$.args.lead_id"}}
  compare: {fields: ["name", "email", "metadata"], against: before_image}
provenance: {source: human, model: null, verified: false, trials: 0, reviewed_by: null}
