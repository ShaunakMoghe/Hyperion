[project]
name = "hyperion"
version = "0.1.0"
description = "Derives, verifies, and executes inverses for agent tool calls against third-party APIs, and measures how much agent side-effect damage can actually be undone."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "poethepoet>=0.28",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hyperion = "hyperion.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
  "stripe: tests hitting real Stripe test mode (skipped without STRIPE_TEST_KEY)",
  "llm: tests calling a real LLM provider (skipped without HYPERION_LLM_PROVIDER)",
  "integration: tests needing real Postgres (docker compose up)",
  "e2e: end-to-end tests with no mocks",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.poe.tasks]
up = "docker compose up -d"
down = "docker compose down"
test = "pytest"
lint = "ruff check src tests"
bench = "python -c \"raise SystemExit('benchmark not frozen until H-070; see bench/CHANGELOG.md')\""
stripe-spec = "python -c \"raise SystemExit('stripe spec fetch not implemented until H-031')\""
