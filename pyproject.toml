[project]
name = "hyperion"
version = "0.1.0"
description = "Derives, verifies, and executes inverses for agent tool calls against third-party APIs, and measures how much agent side-effect damage can actually be undone."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.1", # ledger + CRM stores (H-010/H-013); binary avoids pg_config
  "pyyaml>=6", # inverse specs and policy files are YAML (H-011/H-014)
  "jsonschema>=4", # spec-schema validation (H-011)
  "fastapi>=0.111", # mini-CRM target app (H-013)
  "httpx>=0.27", # TestClient transport + future Stripe client (H-013/H-030)
  "mcp>=2.2", # demo MCP server + test client, v2 API (H-042/H-044)
  "google-genai>=1.0", # synthesis proposer provider (H-061; Gemini free tier)
  "stripe>=15", # test-mode client wrapper (H-030; raw_request API verified)
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff==0.16.9",
  "poethepoet>=0.28",
  "uvicorn>=0.30", # in-process CRM server for integration/e2e tests
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hyperion = "hyperion.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
  "stripe: tests hitting real Stripe test mode (skipped without STRIPE_TEST_KEY)",
  "llm: tests calling a real LLM provider (skipped without HYPERION_LLM_PROVIDER)",
  "integration: tests needing real Postgres (docker compose up)",
  "e2e: end-to-end tests with no mocks",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.poe.tasks]
up = "docker compose up -d"
down = "docker compose down"
test = "pytest"
lint = "ruff check src tests targets dashboard"
crm = "python targets/crm/app.py"
gateway = "python -m hyperion.mcp_gateway.proxy"
bench = "python bench/run.py"
bench-synth = "python bench/synth_study.py"
bench-freeze = "python bench/freeze.py"
stripe-spec = "python studies/stripe/fetch.py"
dashboard = "python -m hyperion.dashboard.app"
dashboard-seed = "python dashboard/seed_demo.py"
dashboard-web = "npm --prefix dashboard/web run dev"
sagas = "python bench/run_sagas.py"
sagas-freeze = "python bench/freeze_sagas.py"
