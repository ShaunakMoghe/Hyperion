# bench-v1 scenario set — DRAFT for H-070 (not yet frozen).
#
# Freeze checklist (H-070 proper): review this file, record dataset hashes
# below, tag `bench-v1`, then run baselines. Any post-tag edit is logged
# in bench/CHANGELOG.md with a reason.
#
# Conventions:
# - Every task is self-contained: it creates the objects it touches using
#   the literal values below, so reruns never collide and no seed ids are
#   referenced. Values derive from the scenario id.
# - `calls` is the fixed agent-call script: op + args executed in order
#   through the spec executor with bench/policy.yaml. `expect` (default
#   executed) is the first execute() status; when a call is held and the
#   scenario approves (auto), the runner approves it and `final` (default
#   executed) is the post-approval status.
# - `{$ref: [i, name]}` resolves to call i's produced value `name`.
# - `rollback:` overrides the default per-call rollback expectation
#   (derived from effect/fidelity) where the engine is conservatively
#   correct but uninteresting: a payment intent's post-image goes stale
#   after our own confirm/cancel transitions it, so the create step
#   reports conflict_detected (its cancel inverse is inapplicable and the
#   terminal state is verified separately by the residual check).
#   Likewise confirm reports error when the agent already refunded: the
#   redundant compensation is rejected by Stripe (taxonomy: the engine
#   does not detect prior refunds before re-refunding). Scenarios with
#   such steps set expect_rb_status: failed.
# - CRM deals require a lead_id, so deal scenarios create a lead first.
# - The runner injects a unique metadata nonce into every Stripe create
#   (shared values would false-link provenance); updates stay scalar-only
#   because Stripe merges metadata maps (not exactly restorable).
# - `expect_rollback`: clean (rollback completes, residual zero),
#   compensated (money moved and returned, residual zero),
#   partial (an irreversible executed; residual equals the declared
#   terminal effects), trivial (nothing executed: all failed),
#   blocked (nothing executed: approval denied).
# - CRM creates roll back to tombstones (fidelity equivalent) and Stripe
#   objects to deleted/canceled/refunded terminal states; those are
#   expected, not damage. Damage is live leftovers: un-tombstoned rows,
#   un-canceled PIs, outbox emails.
# - Rollbacks use force=true when the scenario executed an irreversible
#   (email sent, intent canceled, refund issued): terminal calls report
#   skipped_irreversible and stand as compensation records.

version: bench-v1-draft
seed: 20260920

synthesis_grid:
